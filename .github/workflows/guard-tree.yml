name: guard-tree

# Refuse a tree that lost the repository instead of adding to it (`scripts/guards/guard-tree.mjs`).
#
# `pull_request`, deliberately — not `pull_request_target`: this repository is public, and GitHub's
# default Actions event policy starts *blocking* `pull_request_target` for public repositories on
# 2026-11-02. A required check whose event never fires leaves every PR stuck on "Expected — Waiting"
# (`.ai/lessons/gate-must-cover-every-pr-target.md`, other direction).
#
# What that costs, and why it is still airtight: a head that also deletes `.github/workflows/**` runs
# no workflow of its own, so this check does not report — and `main` requires `guard-tree` (and
# `validate`), so a required check that never reports is a merge that never happens. The explicit red
# check is for the near miss (a tree that lost `src/**` but kept `.github/**`); the missing check plus
# required status checks cover the extreme; `.githooks/pre-push` refuses both before the push leaves
# the machine.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: guard-tree-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard-tree:
    name: guard-tree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The base commit, so the guard script that runs is the trusted one: a head that edits or
      # deletes `scripts/guards/guard-tree.mjs` cannot change the verdict. Nothing from the head is
      # ever checked out into the workspace.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1

      # `refs/pull/<n>/head` resolves for same-repository and fork pull requests alike, so the head
      # tree is read exactly as proposed, not as the merge result.
      - name: Fetch the head of the pull request
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags --depth=1 origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr-head"

      - name: Refuse a tree that lost the repository
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/guards/guard-tree.mjs --base "$BASE_SHA" --head refs/remotes/pr-head
