name: guard-tree

# Refuse a tree that lost the repository instead of adding to it (`scripts/guards/guard-tree.mjs`).
#
# `pull_request`, deliberately — not `pull_request_target`: this repository is public, and GitHub's
# default Actions event policy starts *blocking* `pull_request_target` for public repositories on
# 2026-11-02. A required check whose event never fires leaves every PR stuck on "Expected — Waiting"
# (`.ai/lessons/gate-must-cover-every-pr-target.md`, other direction).
#
# What that costs, and why it is still airtight: a head that also deletes `.github/workflows/**` runs
# no workflow of its own, so this check does not report — and `main` requires `guard-tree` (and
# `validate`), so a required check that never reports is a merge that never happens. The explicit red
# check is for the near miss (a tree that lost `src/**` but kept `.github/**`); the missing check plus
# required status checks cover the extreme; `.githooks/pre-push` refuses both before the push leaves
# the machine.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: guard-tree-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard-tree:
    name: guard-tree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The merge commit, fetched shallow: it carries both sides, and nothing from it is executed —
      # the guard script comes from the base commit below whenever the base carries it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # `refs/pull/<n>/head` resolves for same-repository and fork pull requests alike, so the head
      # tree is read exactly as proposed, not as the merge result. The base commit is fetched too,
      # both for its tree and for its copy of the guard script.
      - name: Fetch both sides of the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git fetch --no-tags --depth=1 origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr-head"

      - name: Refuse a tree that lost the repository
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          guard=scripts/guards/guard-tree.mjs
          if git cat-file -e "${BASE_SHA}:${guard}" 2>/dev/null; then
            git show "${BASE_SHA}:${guard}" > "$RUNNER_TEMP/guard-tree.mjs"
            guard="$RUNNER_TEMP/guard-tree.mjs"
          else
            echo "::notice::${BASE_SHA} does not carry ${guard} yet — running the copy from this pull request"
          fi
          node "$guard" --base "$BASE_SHA" --head refs/remotes/pr-head
