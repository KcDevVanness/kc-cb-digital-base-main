name: validate

# The same gate every agent runs locally (.ai/agentic.config.json → validation.commands),
# executed on every PR and on main so a green check means "the gate passed", not "someone said so".
#
# The job always runs so the required check always reports. The heavy steps are
# skipped when the diff touches nothing the gate can fail on — see the scope step.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The scope check diffs against a base commit the default depth-1
          # checkout does not have.
          fetch-depth: 0

      - name: Decide whether the gate can be skipped
        id: scope
        run: |
          # Changes confined to these paths cannot fail
          # generate / typecheck / lint / ds:check / test / build. The test is an
          # allow-list: anything not listed runs the full gate, so a new source
          # directory can only cost time, never skip a real check.
          #
          # This lives inside the job rather than in `paths-ignore` on purpose:
          # main requires the `validate` check, and a check that is filtered out
          # never reports, leaving the PR stuck on "Expected — Waiting".
          DOCS_ONLY='^(\.github/|docs/|[^/]*\.md$|\.gitignore$|docker-compose\.deploy\.yml$|docker/caddy/|scripts/deploy/)'

          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            # Three-dot: what the PR introduces, relative to the merge base.
            RANGE='${{ github.event.pull_request.base.sha }}...${{ github.sha }}'
          else
            RANGE='${{ github.event.before }}..${{ github.sha }}'
          fi

          case "${RANGE}" in
            ''*|'0000000000000000000000000000000000000000'*)
              echo "needed=true" >> "$GITHUB_OUTPUT"
              echo "no usable base commit — running the gate"
              exit 0
              ;;
          esac

          CHANGED="$(git diff --name-only "${RANGE}" || true)"
          # An empty diff means nothing changed, so the gate cannot fail.
          if [ -z "${CHANGED}" ] || ! printf '%s\n' "${CHANGED}" | grep -qvE "${DOCS_ONLY}"; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "docs / deploy-side only — gate skipped:"
            printf '%s\n' "${CHANGED:-(no files changed)}"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "app sources changed — running the gate"
          fi

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.needed == 'true'
        with:
          node-version: 24

      # package.json pins packageManager: yarn@4.17.1. setup-node's own `cache: yarn`
      # runs the runner's global yarn 1 before corepack exists, which aborts on that
      # field — so corepack comes first, with shims in a writable directory.
      - name: Enable corepack
        if: steps.scope.outputs.needed == 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          corepack enable --install-directory "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Resolve the Yarn cache folder
        if: steps.scope.outputs.needed == 'true'
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        if: steps.scope.outputs.needed == 'true'
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install dependencies
        if: steps.scope.outputs.needed == 'true'
        run: yarn install --immutable

      # The app reads its configuration from .env; CI only needs syntactically valid
      # placeholders — no service (Postgres/Redis/Meilisearch) is contacted by the gate.
      - name: Prepare environment
        if: steps.scope.outputs.needed == 'true'
        run: cp .env.example .env

      - name: generate
        if: steps.scope.outputs.needed == 'true'
        run: yarn generate

      - name: typecheck
        if: steps.scope.outputs.needed == 'true'
        run: yarn typecheck

      - name: lint
        if: steps.scope.outputs.needed == 'true'
        run: yarn lint

      - name: ds:check
        if: steps.scope.outputs.needed == 'true'
        run: yarn ds:check

      - name: test
        if: steps.scope.outputs.needed == 'true'
        run: yarn test

      - name: build
        if: steps.scope.outputs.needed == 'true'
        run: yarn build
