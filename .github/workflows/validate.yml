name: validate

# The same gate every agent runs locally (.ai/agentic.config.json → validation.commands),
# executed on every PR and on main so a green check means "the gate passed", not "someone said so".
#
# Shape — decide, run the two halves at the same time, report once:
#
#   scope    reads the diff and publishes `needed` (docs / deploy-side diffs cannot fail the gate)
#   checks   install → generate → typecheck → lint → lessons → ds:check → test
#   build    install → build (`yarn build` runs `yarn generate` itself)
#   validate the fan-in: green only when scope passed and every slice passed or was skipped as
#            out of scope. This job is the required check `main` waits for.
#
# Why it is split rather than one job: serializing all seven commands made the run ~5:45 end to
# end, and parallel development pays that wall clock once per PR in flight. The critical path is
# now `install + build` instead of the sum of every step. Extra runners are free on this public
# repository, so the trade is minutes of wall clock for minutes of concurrency.
#
# `validate` has to stay a job *name*: branch protection matches a check by name (`main` requires
# `validate` + `guard-tree`), and a required context that never reports leaves every PR on
# "Expected — Waiting" (`.ai/lessons/gate-must-cover-every-pr-target.md`). Renaming the fan-in, or
# replacing it with a matrix, breaks that.
on:
  # Every PR target, not only `main`: unit PRs land on integration branches first, and a gate that
  # skipped them merged a unit with `no checks reported` (2026-09-28). The docs/deploy scope step
  # below keeps doc-only PRs cheap, so widening the trigger costs minutes, not correctness.
  pull_request:
  push:
    branches: [main]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # `needed=false` is the only thing that lets the slices skip; anything else runs the gate.
      needed: ${{ steps.decide.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The scope check diffs against a base commit the default depth-1 checkout does not have.
          fetch-depth: 0

      - name: Decide whether the gate can be skipped
        id: decide
        run: |
          # Changes confined to these paths cannot fail
          # generate / typecheck / lint / ds:check / test / build. The test is an
          # allow-list: anything not listed runs the full gate, so a new source
          # directory can only cost time, never skip a real check.
          #
          # This is deliberately not `paths-ignore` on the workflow: a check that is
          # filtered out never reports, and `main` requires `validate`.
          #
          # Run plans and analysis notes are pure metadata, so they join the allow-list.
          # A lesson edit is NOT listed: the lessons step must run for it.
          DOCS_ONLY='^(\.github/|docs/|[^/]*\.md$|\.gitignore$|docker-compose\.deploy\.yml$|docker/caddy/|scripts/deploy/|\.ai/runs/|\.ai/analysis/)'

          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            # Three-dot: what the PR introduces, relative to the merge base.
            RANGE='${{ github.event.pull_request.base.sha }}...${{ github.sha }}'
          else
            RANGE='${{ github.event.before }}..${{ github.sha }}'
          fi

          # `''*` would concatenate to a bare `*` and match everything, so the
          # empty-before case is spelled as a leading `..` instead.
          case "${RANGE}" in
            '0000000000000000000000000000000000000000'*|'..'*)
              echo "needed=true" >> "$GITHUB_OUTPUT"
              echo "no usable base commit — running the gate"
              exit 0
              ;;
          esac

          CHANGED="$(git diff --name-only "${RANGE}" || true)"
          # An empty diff means nothing changed, so the gate cannot fail.
          if [ -z "${CHANGED}" ] || ! printf '%s\n' "${CHANGED}" | grep -qvE "${DOCS_ONLY}"; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "docs / deploy-side only — gate skipped:"
            printf '%s\n' "${CHANGED:-(no files changed)}"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "app sources changed — running the gate"
          fi

  checks:
    name: checks
    needs: scope
    if: needs.scope.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # package.json pins packageManager: yarn@4.17.1. setup-node's own `cache: yarn`
      # runs the runner's global yarn 1 before corepack exists, which aborts on that
      # field — so corepack comes first, with shims in a writable directory.
      - name: Enable corepack
        run: |
          mkdir -p "$HOME/.local/bin"
          corepack enable --install-directory "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Resolve the Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      # tsconfig.json sets `incremental`, so `tsc --noEmit` only re-checks what the recorded
      # program does not already cover — but a fresh runner starts with no record and pays the
      # full-project check (~75s) on every PR. Restoring the record is what keeps that step
      # incremental; TypeScript invalidates it by file content and compiler options, so a stale
      # entry costs time, never a missed error.
      - name: Cache the incremental type-check state
        uses: actions/cache@v4
        with:
          path: tsconfig.tsbuildinfo
          key: tsc-${{ runner.os }}-${{ hashFiles('yarn.lock', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: tsc-${{ runner.os }}-${{ hashFiles('yarn.lock', 'tsconfig.json') }}-

      - name: Install dependencies
        run: yarn install --immutable

      # The app reads its configuration from .env; CI only needs syntactically valid
      # placeholders — no service (Postgres/Redis/Meilisearch) is contacted by the gate.
      - name: Prepare environment
        run: cp .env.example .env

      - name: generate
        run: yarn generate

      - name: typecheck
        run: yarn typecheck

      - name: lint
        run: yarn lint

      # The lessons catalog is the durable-rule store every session routes through; it fails closed
      # on a malformed record, a missing index row, or prose that belongs in `.ai/lessons/`.
      - name: lessons
        run: node scripts/check-lessons.mjs

      - name: ds:check
        run: yarn ds:check

      - name: test
        run: yarn test

  build:
    name: build
    needs: scope
    if: needs.scope.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack
        run: |
          mkdir -p "$HOME/.local/bin"
          corepack enable --install-directory "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Resolve the Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      # `next build` type-checks the project itself, with its own incremental record under
      # `distDir/cache` (next/dist/lib/typescript/runTypeCheck.js) — a separate file from the one
      # `yarn typecheck` writes, so it needs its own cache or the build pays a second full check.
      # Same reasoning as the `checks` job: a stale record costs time, never a missed error.
      - name: Cache the build's type-check state
        uses: actions/cache@v4
        with:
          path: .mercato/next/cache/.tsbuildinfo
          key: next-tsc-${{ runner.os }}-${{ hashFiles('yarn.lock', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: next-tsc-${{ runner.os }}-${{ hashFiles('yarn.lock', 'tsconfig.json') }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Prepare environment
        run: cp .env.example .env

      # `yarn build` is `yarn generate && next build`, so the generate step is not repeated here.
      - name: build
        run: yarn build

  validate:
    name: validate
    needs: [scope, checks, build]
    # `always()`: this is the check branch protection waits for, so it has to report even when a
    # needed job failed or was skipped.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the gate result
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SCOPE_NEEDED: ${{ needs.scope.outputs.needed }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          # `skipped` is only meaningful for a slice the scope step sent home; a slice that
          # skipped while it was needed would be a silent hole, so it fails here instead.
          failed=0
          report() {
            name="$1"; result="$2"
            case "${result}" in
              success)
                echo "✔ ${name}"
                ;;
              skipped)
                if [ "${SCOPE_NEEDED}" = 'true' ]; then
                  echo "::error::${name} was skipped although the scope step asked for it"
                  echo "✘ ${name} (skipped while needed)"
                  failed=1
                else
                  echo "· ${name} (out of scope)"
                fi
                ;;
              *)
                echo "::error::${name} did not pass (${result})"
                echo "✘ ${name} (${result})"
                failed=1
                ;;
            esac
          }
          report scope "${SCOPE_RESULT}"
          report checks "${CHECKS_RESULT}"
          report build "${BUILD_RESULT}"

          if [ "${failed}" -ne 0 ]; then
            exit 1
          fi
          echo "gate passed"
