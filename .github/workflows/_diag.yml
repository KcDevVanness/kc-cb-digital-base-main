name: _diag

# TEMPORARY diagnostic channel. Deleted once the investigation is done.
#
# Exists because the operator's own egress IP is refused by the host's sshd at
# the banner stage, while CI's runner is accepted — so this reuses the same
# access path the deploy job already has.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect the host over ssh
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/diag_key
          chmod 600 ~/.ssh/diag_key
          ssh -i ~/.ssh/diag_key -o StrictHostKeyChecking=accept-new \
              -o ServerAliveInterval=15 \
              "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -u
          cd /opt/kc-cb-digital-base || exit 1

          echo "########## 1. root redirect (http) ##########"
          curl -sS -D - -o /dev/null --max-time 15 \
            -H 'Host: dgital-base.kc-trade.cn' http://127.0.0.1/ \
            | grep -iE '^HTTP|^location'

          echo
          echo "########## 2. root redirect (https) ##########"
          curl -sS -D - -o /dev/null --max-time 20 \
            --resolve dgital-base.kc-trade.cn:443:127.0.0.1 \
            https://dgital-base.kc-trade.cn/ \
            | grep -iE '^HTTP|^location'

          echo
          echo "########## 3. caddy access log (last 25 lines) ##########"
          docker compose -f docker-compose.deploy.yml logs caddy --tail 25 2>&1 \
            | sed -E 's/("request"|uri)[^,]*/\1 <trimmed>/' | cut -c1-220

          echo
          echo "########## 4. sshd penalty config ##########"
          sudo sshd -T 2>/dev/null | grep -iE 'persource|maxstartups|logingracetime' || echo '(no match)'

          echo
          echo "########## 5. sshd journal (last 15) ##########"
          sudo journalctl -u ssh -n 15 --no-pager 2>/dev/null | cut -c1-200 || echo '(journal unavailable)'

          echo
          echo "########## 6. who is logged in ##########"
          who
          REMOTE
