name: deploy

# Only the release branch deploys. `main` and feature branches are covered by
# validate.yml; promoting a commit to production is an explicit `git push origin
# main:production` (or a merge into production), never a side effect of merging
# to main.
on:
  push:
    branches: [production]
  workflow_dispatch:

# A deploy that is already running must finish before the next one starts —
# cancelling mid-`up -d` would leave the stack half-swapped.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # GHCR rejects uppercase paths; the owner is `KcDevVanness`, so this is spelled
  # out lowercase rather than derived from github.repository.
  IMAGE: ghcr.io/kcdevvanness/kc-cb-digital-base-main
  APP_DIR: /opt/kc-cb-digital-base

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # The app is a large Next.js tree; `yarn install` plus the production build
      # overflows the runner's default ~14 GB before the image is even assembled.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: meta
        run: echo "image=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # `runner` is the last stage, but naming it keeps the deploy artifact
          # from silently becoming the `dev` stage if the file is reordered.
          target: runner
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:production
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pins the host key on first contact; later runs fail loudly if it changes.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
              -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" true

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          TARGET_SHA: ${{ github.sha }}
          APP_IMAGE: ${{ needs.build.outputs.image }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GHCR packages default to private, and `deploy.sh` pulls on the host.
          # GITHUB_TOKEN is scoped to this repository and this run, so the login
          # is piped straight into `--password-stdin` — it never lands in argv,
          # a file, or the shell history of the host. A login failure is only a
          # warning: `compose pull` is the real gate and reports loudly if the
          # package genuinely needs credentials.
          printf '%s' "$GHCR_TOKEN" \
            | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
                "${DEPLOY_USER}@${DEPLOY_HOST}" \
                "docker login ghcr.io -u '${GHCR_ACTOR}' --password-stdin" \
            || echo "::warning::ghcr login failed; continuing (package may be public)"

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "TARGET_SHA='${TARGET_SHA}' APP_IMAGE='${APP_IMAGE}' APP_DIR='${APP_DIR}' bash -s" \
              < scripts/deploy/deploy.sh
