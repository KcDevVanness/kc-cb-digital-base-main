name: deploy

# Only the release branch deploys. `main` and feature branches are covered by
# validate.yml; promoting a commit to production is an explicit `git push origin
# main:production` (or a merge into production), never a side effect of merging
# to main.
on:
  push:
    branches: [production]
  workflow_dispatch:

# A deploy that is already running must finish before the next one starts —
# cancelling mid-`up -d` would leave the stack half-swapped.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # GHCR rejects uppercase paths; the owner is `KcDevVanness`, so this is spelled
  # out lowercase rather than derived from github.repository.
  IMAGE: ghcr.io/kcdevvanness/kc-cb-digital-base-main
  APP_DIR: /opt/kc-cb-digital-base

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The scope check diffs the pushed range, which needs the previous
          # commit; the default depth-1 checkout does not have it.
          fetch-depth: 0

      - name: Decide whether the image needs rebuilding
        id: scope
        run: |
          # Paths that change how the stack is shipped but never what is inside
          # the image. The test is deliberately an allow-list: anything not
          # listed rebuilds, so adding a new source directory can only cost
          # build time, never ship a stale image.
          DEPLOY_ONLY='^(\.github/|docs/|[^/]*\.md$|docker-compose\.deploy\.yml$|docker/caddy/|scripts/deploy/)'
          BEFORE='${{ github.event.before }}'

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "app_changed=true" >> "$GITHUB_OUTPUT"
            echo "no previous commit (first push or manual dispatch) — rebuilding"
            exit 0
          fi

          CHANGED="$(git diff --name-only "$BEFORE" "${GITHUB_SHA}")"
          if [ -n "$CHANGED" ] && ! printf '%s\n' "$CHANGED" | grep -qvE "$DEPLOY_ONLY"; then
            echo "app_changed=false" >> "$GITHUB_OUTPUT"
            echo "only deploy-side files changed — reusing the existing image:"
            printf '%s\n' "$CHANGED"
          else
            echo "app_changed=true" >> "$GITHUB_OUTPUT"
            echo "app sources changed — rebuilding"
          fi

      - name: Resolve the image to deploy
        id: meta
        run: |
          if [ '${{ steps.scope.outputs.app_changed }}' = 'true' ]; then
            echo "image=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            # Nothing inside the image changed, so the last built tag is still
            # the correct artifact. The deploy job still runs, because compose
            # and Caddyfile edits do need to be applied.
            echo "image=${IMAGE}:production" >> "$GITHUB_OUTPUT"
          fi

      # The app is a large Next.js tree; `yarn install` plus the production build
      # overflows the runner's default ~14 GB before the image is even assembled.
      - name: Free disk space
        if: steps.scope.outputs.app_changed == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - uses: docker/setup-buildx-action@v3
        if: steps.scope.outputs.app_changed == 'true'

      - uses: docker/login-action@v3
        if: steps.scope.outputs.app_changed == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.scope.outputs.app_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          # `runner` is the last stage, but naming it keeps the deploy artifact
          # from silently becoming the `dev` stage if the file is reordered.
          target: runner
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:production
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pins the host key on first contact; later runs fail loudly if it changes.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
              -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" true

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          TARGET_SHA: ${{ github.sha }}
          APP_IMAGE: ${{ needs.build.outputs.image }}
        run: |
          # ServerAliveInterval matters: an 8.6 GB image pull is minutes of
          # near-idle traffic, and the first version of this job died at
          # `client_loop: send disconnect: Broken pipe` because the session had
          # nothing to carry.
          #
          # No `docker login` step: the GHCR package is publicly pullable (the
          # initial deploy pulled it with no credentials at all), and logging in
          # left a GITHUB_TOKEN in the host's ~/.docker/config.json that expired
          # with the run and then *broke* later pulls with `denied`. If the
          # package is ever made private, the host needs a long-lived
          # credential instead — not this job's token.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=20 \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "TARGET_SHA='${TARGET_SHA}' APP_IMAGE='${APP_IMAGE}' APP_DIR='${APP_DIR}' bash -s" \
              < scripts/deploy/deploy.sh
