# Production compose for the AWS deployment host.
#
# Difference from `docker-compose.fullapp.yml`: the app image is pulled from the
# registry instead of built on the host. The deployment host is a 2 GB instance
# and `next build` needs an 8 GB heap, so building happens in GitHub Actions
# (`.github/workflows/deploy.yml`) and the host only runs the result.
#
# Usage on the host (from the repository root, which holds the gitignored `.env`):
#   docker compose -f docker-compose.deploy.yml pull app
#   docker compose -f docker-compose.deploy.yml up -d
#
# `.env` is loaded automatically from this directory; it is not in git and must
# exist before the first `up`. Required: POSTGRES_*, JWT_SECRET, APP_DOMAIN,
# APP_URL (must be https://<APP_DOMAIN> — the framework sets Secure cookies in
# production, so plain HTTP cannot hold a session in a browser).

name: kc-cb-digital-base

# The default json-file driver has no size cap, and this host's root volume is
# ~28 GB shared with Postgres. An app that logs as much as this one can fill it
# over months, so every service is capped at 30 MB of logs.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/kcdevvanness/kc-cb-digital-base-main:production}
    logging: *default-logging
    # Root because the init script and the attachment store both write into
    # bind/volume paths owned by root on first creation (mirrors fullapp).
    user: "0"
    restart: unless-stopped
    command:
      - /bin/sh
      - -lc
      - |
        if [ ! -f /app/docker/scripts/init-or-migrate.sh ]; then
          echo "ERROR: init-or-migrate.sh not found. Rebuild the image." >&2
          exit 1
        fi
        sh /app/docker/scripts/init-or-migrate.sh
        yarn start
    working_dir: /app
    volumes:
      - init_marker:/tmp/init-marker
      - attachments_storage:/app/storage
    ports:
      # Loopback only: Caddy is the public entrypoint and terminates TLS. This
      # bind exists for the deploy health probe and for host-side debugging.
      - "127.0.0.1:${APP_PORT:-3000}:${CONTAINER_PORT:-3000}"
    environment:
      NODE_ENV: production
      DEPLOY_ENV: ${DEPLOY_ENV:-production}
      PORT: ${CONTAINER_PORT:-3000}
      # t3.large (2 vCPU / 8 GB): cap the V8 heap well below total RAM so GC
      # runs instead of the OOM killer, while leaving room for Postgres, Redis,
      # Meilisearch and Caddy. Raise only alongside the instance size.
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=3072}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-open-mercato}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
      DB_POOL_ACQUIRE_TIMEOUT: ${DB_POOL_ACQUIRE_TIMEOUT:-6000}
      DB_POOL_IDLE_TIMEOUT: ${DB_POOL_IDLE_TIMEOUT:-3000}
      DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: ${DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-120000}
      # No default: a published fallback secret lets anyone forge tokens.
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in the .env file next to this compose file - generate one with: openssl rand -hex 32}"
      JWT_LEGACY_GRACE_MINUTES: "${JWT_LEGACY_GRACE_MINUTES:-480}"
      JWT_LEGACY_CUTOVER_AT: "${JWT_LEGACY_CUTOVER_AT:-}"
      AUTH_SECRET: ${AUTH_SECRET:-}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      APP_URL: ${APP_URL:?set APP_URL to the public origin, e.g. https://app.example.com}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-}
      REDIS_URL: redis://redis:6379
      QUEUE_REDIS_URL: redis://redis:6379
      QUEUE_STRATEGY: ${QUEUE_STRATEGY:-async}
      NEXT_PUBLIC_QUEUE_STRATEGY: ${NEXT_PUBLIC_QUEUE_STRATEGY:-async}
      CACHE_REDIS_URL: redis://redis:6379
      CACHE_STRATEGY: ${CACHE_STRATEGY:-redis}
      RATE_LIMIT_STRATEGY: ${RATE_LIMIT_STRATEGY:-memory}
      OM_MULTI_INSTANCE: ${OM_MULTI_INSTANCE:-false}
      OM_INSTANCE_COUNT: ${OM_INSTANCE_COUNT:-1}
      ENABLE_CRUD_API_CACHE: ${ENABLE_CRUD_API_CACHE:-true}
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_MASTER_KEY:-meilisearch-dev-key}
      MEILISEARCH_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-meilisearch-dev-key}
      TENANT_DATA_ENCRYPTION: ${TENANT_DATA_ENCRYPTION:-yes}
      TENANT_DATA_ENCRYPTION_DEBUG: ${TENANT_DATA_ENCRYPTION_DEBUG:-false}
      TENANT_DATA_ENCRYPTION_FALLBACK_KEY: ${TENANT_DATA_ENCRYPTION_FALLBACK_KEY:-}
      TENANT_DATA_ENCRYPTION_KEY: ${TENANT_DATA_ENCRYPTION_KEY:-}
      LOOKUP_HASH_PEPPER: ${LOOKUP_HASH_PEPPER:-}
      CONSENT_INTEGRITY_SECRET: ${CONSENT_INTEGRITY_SECRET:-}
      # Unset disables realtime document collaboration (single-user editing keeps working).
      NEXT_PUBLIC_DOCUMENTS_COLLAB_URL: ${NEXT_PUBLIC_DOCUMENTS_COLLAB_URL:-}
      DEMO_MODE: ${DEMO_MODE:-false}
      SELF_SERVICE_ONBOARDING_ENABLED: ${SELF_SERVICE_ONBOARDING_ENABLED:-false}
      OM_HIDE_BACKEND_FOOTER: ${OM_HIDE_BACKEND_FOOTER:-false}
      OM_ENABLE_ENTERPRISE_MODULES: ${OM_ENABLE_ENTERPRISE_MODULES:-false}
      OM_DISABLE_VECTOR_SEARCH_AUTOINDEXING: ${OM_DISABLE_VECTOR_SEARCH_AUTOINDEXING:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      OM_INIT_SUPERADMIN_EMAIL: ${OM_INIT_SUPERADMIN_EMAIL:-}
      OM_INIT_SUPERADMIN_PASSWORD: ${OM_INIT_SUPERADMIN_PASSWORD:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      # Liveness of the Next server itself; /api/healthz additionally probes
      # database and redis, so a 200 here means the whole chain answers.
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s
    networks:
      - mercato-network

  postgres:
    image: pgvector/pgvector:pg17-trixie
    logging: *default-logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-open-mercato}
    # Sized for the 8 GB host: the planner's footprint has to stay inside the
    # memory the app, Redis and Meilisearch leave behind.
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - max_connections=100
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mercato-network

  redis:
    image: redis:7-alpine
    logging: *default-logging
    restart: unless-stopped
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis_data:/data
    command: redis-server /usr/local/etc/redis/redis.conf --maxmemory ${REDIS_MAXMEMORY:-512mb}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mercato-network

  meilisearch:
    image: getmeili/meilisearch:v1.11
    logging: *default-logging
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-meilisearch-dev-key}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mercato-network

  # Public entrypoint. Terminates TLS so the app's Secure cookies (hard-coded to
  # NODE_ENV === "production" in the framework) are actually stored by browsers.
  caddy:
    image: caddy:2.11-alpine
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Both are read by the Caddyfile's {$...} placeholders, not by the app.
      APP_DOMAIN: "${APP_DOMAIN:?set APP_DOMAIN in the .env file next to this compose file, e.g. app.example.com}"
      APP_UPSTREAM: "app:${CONTAINER_PORT:-3000}"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_started
    networks:
      - mercato-network

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
  init_marker:
  attachments_storage:
  # Issued certificates and the ACME account key. Losing caddy_data re-issues on
  # next boot, which burns Let's Encrypt rate limit — keep it.
  caddy_data:
  caddy_config:

networks:
  mercato-network:
    driver: bridge
